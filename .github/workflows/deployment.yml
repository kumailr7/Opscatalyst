name: Deploy to Vercel

on:
  push:
    branches:
      - v4
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: DEBUG Matomo connectivity
        run: |
          echo "runner egress IP:"
          curl -sS https://api.ipify.org || true
          echo ""
          echo "unauthenticated getMatomoVersion:"
          curl -sS -o /tmp/out.txt -w "HTTP %{http_code}\n" "https://analytics.devops-dojo.ninja/index.php?module=API&method=API.getMatomoVersion&format=JSON"
          cat /tmp/out.txt
          echo ""
          echo "matomo.js static asset:"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://analytics.devops-dojo.ninja/matomo.js"

      - name: Fetch Matomo most-read data
        run: node scripts/fetch-most-read.mjs
        env:
          MATOMO_API_TOKEN: ${{ secrets.MATOMO_API_TOKEN }}

      - name: Build Quartz
        run: npx quartz build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }} --name ${{ secrets.VERCEL_PROJECT_ID }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
